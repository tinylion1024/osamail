[package]
name = "osamail"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A tiny, scriptable CLI for Apple Mail, powered by osascript."
repository = "https://github.com/tinylion1024/osamail"
readme = "README.md"
keywords = ["macos", "mail", "cli", "osascript", "automation"]
categories = ["command-line-utilities"]
exclude = [".omx/", ".codebase-memory/", "dist/"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"
