name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build universal macOS release
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust and macOS targets
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - name: Validate tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          expected_tag="v${cargo_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo version ${cargo_version}" >&2
            exit 1
          fi

      - name: Run full quality gate
        run: ./scripts/check.sh

      - name: Build universal archive and checksum
        run: ./scripts/build-universal.sh

      - name: Verify release artifact names
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/osamail-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz"
          test -f "dist/osamail-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz.sha256"

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/osamail-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz" \
            "dist/osamail-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "OsaMail ${GITHUB_REF_NAME}"
